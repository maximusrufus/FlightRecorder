name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,billing]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Check no committed Stripe keys
        run: python scripts/check_no_stripe_keys.py
